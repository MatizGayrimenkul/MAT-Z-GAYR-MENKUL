<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Personel Girişi - Matiz Gayrimenkul</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f1f2f6; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #2d3436; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0984e3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #74b9ff; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Personel Girişi</h2>
        <form id="loginForm">
            <div>
                <label for="username">Kullanıcı Adı:</label>
                <input type="text" id="username" required>
            </div>
            <div>
                <label for="password">Şifre:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Giriş Yap</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Giriş başarılı! İlan paneline yönlendiriliyorsunuz.');
        });
    </script>
</body>
</html>
